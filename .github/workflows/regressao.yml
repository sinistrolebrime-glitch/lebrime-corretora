name: Regressões do portal Lebrime
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check script.js && node --check financeiro.js && node --check financeiro-ui.js && node --check operacional-financeiro.js && node --check supabase/functions/lebrime-api/operational_finance_rules.mjs
      - run: node tests/regression.cjs
      - run: node tests/financeiro.cjs

      - run: node tests/pdf_installments.mjs
      - run: node tests/due_day_projection.mjs
      - run: node tests/due_day_ui.cjs
      - run: node tests/proposal_preview.mjs
      - run: node tests/allianz_real_layouts.mjs
      - run: node --check renovacao-previa.js
      - run: node tests/proposal_preview_ui.cjs
      - run: node --check supabase/functions/lebrime-api/proposal_preview.mjs
      - run: node tests/operational_finance.mjs
      - run: node --experimental-strip-types tests/operational_integration.mjs
      - run: node tests/operational_auth.cjs
      - run: node --check operacional-extras.js
      - run: node --experimental-strip-types --check supabase/functions/lebrime-operational-portal/index.ts
      - run: node tests/operational_extras.cjs
      - run: node --check operacional-renovacoes.js
      - run: node tests/operational_renewals.cjs
      - run: node --check renovacao-cadastro.js
      - run: node tests/renewal_import.cjs
      - run: node --check importacao-lote.js
      - run: node tests/bulk_import.cjs
      - run: node --check continuidade-importacao.js
      - run: node tests/import_recovery.cjs
      - run: node --check central-conferencia.js
      - run: node tests/review_center.cjs
      - run: node --check gerencial-ficha-abas.js
      - run: node tests/manager_client_tabs.cjs
      - run: node tests/endorsement_history.cjs
      - run: node --check qualidade-carteira.js
      - run: node tests/portfolio_quality.cjs
      - run: node tests/live_smoke.cjs
