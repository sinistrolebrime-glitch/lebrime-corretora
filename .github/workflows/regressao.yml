name: Regressões do portal Lebrime
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check script.js && node --check financeiro.js && node --check financeiro-ui.js
      - run: node tests/regression.cjs
      - run: node tests/financeiro.cjs

      - run: node tests/pdf_installments.mjs
